name: bench
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - uses: homebrew/actions/setup-homebrew@2026.11.09.1
      - run: brew install chezscheme
      - run: |
          old=${{ github.base_ref }}

          if [ -n "$old" ]; then
            git checkout $old
          else
            git checkout HEAD^
          fi

          cargo install --path command
      - run: git checkout ${{ github.sha }}
      - run: tools/bench.sh
